<app-header></app-header>
<div class="login-wrapper">
  <div class="login-card">

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <span class="icon">👤</span>
        <input type="email" placeholder="Email address" formControlName="email" />
      </div>

      <div class="form-group password-field">
        <span class="icon">🔒</span>
        <input [type]="hidePassword ? 'password' : 'text'" placeholder="Password" formControlName="password" />
        <button type="button" class="toggle-password" (click)="hidePassword = !hidePassword"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'">
          <img [src]="hidePassword ? 'assets/show.png' : 'assets/hide.png'" alt="toggle password visibility"
            class="password-icon" />
        </button>
      </div>

      <div class="options">
        <label class="checkbox">
          <input type="checkbox" formControlName="rememberMe" />
          <span class="smp">Save my password</span>
        </label>
      </div>

      <button type="submit" class="btn primary">
        LOGIN
      </button>

      <a href="#" class="link">Forget Password</a>

    </form>

  </div>
</div>
