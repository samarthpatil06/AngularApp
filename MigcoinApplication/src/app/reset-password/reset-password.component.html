<div class="page">
  <div class="card">
    <h2>Reset Password</h2>
    <p class="subtitle">Set a new password for your account.</p>

    <div class="error" *ngIf="!token || !email">
      Invalid reset link. Please request a new password reset email.
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="token && email">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" formControlName="newPassword" placeholder="Enter new password" />

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Confirm password" />

      <button type="submit" [disabled]="isSubmitting || form.invalid">
        {{ isSubmitting ? 'Updating...' : 'Reset Password' }}
      </button>
    </form>

    <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <a routerLink="/login" class="back-link">Back to Login</a>
  </div>
</div>
