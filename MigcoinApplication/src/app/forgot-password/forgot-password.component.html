<div class="page">
  <div class="card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to receive a password reset link.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!submitted">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Enter your email" />

      <button type="submit" [disabled]="isSubmitting || form.invalid">
        {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <p class="success" *ngIf="submitted">
      If this email exists, a reset link has been sent. Check your inbox.
    </p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <a routerLink="/login" class="back-link">Back to Login</a>
  </div>
</div>
