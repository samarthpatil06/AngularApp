<nav class="navbar">
  <div class="menu-icon" (click)="toggleMenu()">
    ☰
  </div>

  <div class="title">
    {{ title }}
  </div>

  <div class="search-container" *ngIf="!isMenuOpen"> <!-- This *ngIf = "!isMenuOpen" To hide the Search bar-->
    <input type="text" placeholder="Search..." class="search-input" [formControl]="searchControl"
      (focus)="showResults = !!searchControl.value" (blur)="hideBox()">
    <button class="search-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path
          d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
      </svg>
    </button>

    <!-- Results Dropdown -->
    <div class="search-results" *ngIf="showResults && searchResults.length > 0">
      <div class="result-item" *ngFor="let user of searchResults" (click)="selectUser(user)">
        <div class="user-name">{{ user.firstName }} {{ user.lastName }}</div>
        <div class="user-meta">{{ user.email }} <span *ngIf="user.phone">• {{ user.phone }}</span></div>
      </div>
    </div>
  </div>
</nav>

<!-- Side Menu -->
<div class="side-menu" [class.open]="isMenuOpen">
  <ul>
    <li *ngFor="let item of menuItems" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
      <a [routerLink]="item.route" (click)="handleItemClick(item)">
        {{ item.label }}
      </a>
    </li>
  </ul>
</div>

<!-- Overlay -->
<div class="overlay" *ngIf="isMenuOpen" (click)="toggleMenu()">
</div>
