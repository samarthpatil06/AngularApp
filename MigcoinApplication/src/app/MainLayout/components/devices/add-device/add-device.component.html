<div class="overlay">
  <div class="modal">

    <div class="modal-title">ADD DEVICE MODEL</div>

    <!-- UI-only (future use) -->
    <input placeholder="DEVICE MAC ID" [(ngModel)]="device.macId" disabled />

    <!-- Backend-aligned fields -->
    <input placeholder="MODEL CODE" [(ngModel)]="device.modelCode" />
    <input placeholder="MODEL NAME" [(ngModel)]="device.modelName" />

    <input
      type="number"
      min="1"
      max="8"
      placeholder="NUMBER OF CHANNELS (1–8)"
      [(ngModel)]="device.numberOfChannels"
      (change)="updateChannels()"
    />

    <div *ngFor="let ch of device.channels">
      <div class="channel-title">CHANNEL {{ ch.channelNo }}</div>

      <input
        type="number"
        placeholder="MIN RANGE"
        [(ngModel)]="ch.rangeLow"
      />

      <input
        type="number"
        placeholder="MAX RANGE"
        [(ngModel)]="ch.rangeHigh"
      />

      <select [(ngModel)]="ch.unit">
        <option value="">Unit</option>
        <option *ngFor="let u of ALLOWED_UNITS">{{ u }}</option>
      </select>
    </div>

    <div class="actions">
      <button (click)="submit()">SAVE</button>
      <button class="cancel" (click)="cancel()">CANCEL</button>
    </div>

  </div>
</div>
