<div class="overlay">
  <div class="modal">

    <div class="modal-title">ADD DEVICE MODEL</div>

    <!-- UI-only field -->
    <input 
      placeholder="DEVICE MAC ID (Not assigned yet)" 
      [(ngModel)]="device.macId" 
      disabled 
    />

    <!-- Backend-aligned fields -->
    <input 
      placeholder="MODEL CODE *" 
      [(ngModel)]="device.modelCode" 
    />

    <input 
      placeholder="MODEL NAME *" 
      [(ngModel)]="device.modelName" 
    />

    <select 
      [(ngModel)]="device.numberOfChannels" 
      (ngModelChange)="updateChannels()"
    >
      <option *ngFor="let num of CHANNEL_OPTIONS" [value]="num">
        {{ num }} Channel{{ num > 1 ? 's' : '' }}
      </option>
    </select>

    <!-- Channel Configuration -->
    <div class="sub-title">CHANNEL CONFIGURATION</div>

    <div *ngFor="let ch of device.channels" class="channel-section">
      <div class="channel-label">CH {{ ch.channelNo }}</div>

      <input
        type="number"
        placeholder="MIN RANGE *"
        [(ngModel)]="ch.rangeLow"
      />

      <input
        type="number"
        placeholder="MAX RANGE *"
        [(ngModel)]="ch.rangeHigh"
      />

      <select [(ngModel)]="ch.unit">
        <option value="">SELECT UNIT *</option>
        <option *ngFor="let u of ALLOWED_UNITS" [value]="u">{{ u }}</option>
      </select>
    </div>

    <div class="actions">
      <button (click)="submit()" class="save-btn">SAVE</button>
      <button (click)="cancel()" class="cancel-btn">CANCEL</button>
    </div>

  </div>
</div>
