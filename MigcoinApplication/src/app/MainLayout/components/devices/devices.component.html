<div class="content">

  <!-- Header Row -->
  <div class="section-header">
    <span>DEVICE MODELS</span>
    <button class="add-btn" (click)="openAddDevice()">ADD DEVICE MODEL</button>
  </div>

  <!-- Empty State -->
  <div class="empty" *ngIf="deviceModels.length === 0">
    You currently have no device models
  </div>

  <!-- Device Models List -->
  <div class="table" *ngIf="deviceModels.length > 0">
    <div class="table-header">
      <span>MODEL CODE</span>
      <span>MODEL NAME</span>
      <span>CHANNELS</span>
    </div>

    <div class="table-row" *ngFor="let model of deviceModels">
      <span>{{ model.modelCode }}</span>
      <span>{{ model.modelName }}</span>
      <span>{{ model.numberOfChannels }}</span>
    </div>
  </div>

</div>

<app-add-device *ngIf="showAddModal" (close)="closeAddDevice()" (save)="addDevice($event)">
</app-add-device>
