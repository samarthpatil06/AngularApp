name: Build & Push Docker Images

on:
  push:
    branches:
      - Siddharth

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t siddhu101010/migcoin-backend:latest ./backend
          docker push siddhu101010/migcoin-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t siddhu101010/migcoin-frontend:latest ./MigcoinApplication
          docker push siddhu101010/migcoin-frontend:latest